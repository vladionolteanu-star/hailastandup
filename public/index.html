<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hai la stand-up · ce se joacă azi în România</title>
<meta name="description" content="Toate showurile de stand-up din România, zi cu zi: ora, sala, prețul. Datele vin de pe iaBilet.">
<link rel="canonical" href="https://hailastandup.ro/">
<meta name="theme-color" content="#fbfbfc" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#1b1c1f" media="(prefers-color-scheme:dark)">
<meta property="og:type" content="website">
<meta property="og:site_name" content="hailastandup">
<meta property="og:title" content="Hai la stand-up">
<meta property="og:description" content="Ce se joacă azi, în toată țara. Ora, sala, prețul.">
<meta property="og:url" content="https://hailastandup.ro/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&display=swap">
<style>
:root{
  --bg:oklch(0.993 0.001 265);
  --panou:oklch(0.972 0.002 265);
  --linie:oklch(0.912 0.003 265);
  --linie-2:oklch(0.947 0.002 265);
  --text:oklch(0.205 0.006 265);
  --text-2:oklch(0.535 0.010 265);
  --text-3:oklch(0.678 0.009 265);
  --semnal:oklch(0.572 0.198 27);
  --ring:oklch(0.205 0.006 265/.10);
  --umbra:0 10px 30px -14px oklch(0.205 0.006 265/.26);
  --r:10px;
  --r-ctl:8px;
  --e:cubic-bezier(.22,1,.36,1);
  --f:"Geist","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:oklch(0.172 0.004 265);
    --panou:oklch(0.214 0.005 265);
    --linie:oklch(0.290 0.006 265);
    --linie-2:oklch(0.244 0.005 265);
    --text:oklch(0.964 0.002 265);
    --text-2:oklch(0.688 0.008 265);
    --text-3:oklch(0.556 0.008 265);
    --semnal:oklch(0.682 0.183 27);
    --ring:oklch(0.964 0.002 265/.13);
    --umbra:0 10px 30px -14px oklch(0 0 0/.62);
  }
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--f);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input{font:inherit;font-family:var(--f);color:inherit}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em}
:focus-visible{outline:2px solid var(--text);outline-offset:2px;border-radius:4px}
.lat{max-width:1180px;margin:0 auto;padding:0 24px}
.nums{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.sus{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--linie-2)}
.sus__in{display:flex;align-items:center;gap:14px;height:56px}
.marca{font-size:15px;font-weight:600;letter-spacing:-.02em;flex:none}

.cauta{position:relative;flex:1 1 auto;max-width:440px}
.cauta__lupa{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.cauta input{
  width:100%;height:34px;padding:0 40px 0 32px;
  border:1px solid var(--linie);border-radius:var(--r-ctl);background:var(--panou);
  font-size:13.5px;transition:border-color .16s var(--e),background .16s var(--e),box-shadow .16s var(--e);
}
.cauta input::placeholder{color:var(--text-3)}
.cauta input:focus{outline:none;border-color:var(--text-3);background:var(--bg);box-shadow:0 0 0 3px var(--ring)}
.cauta kbd{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  height:19px;min-width:19px;display:grid;place-items:center;padding:0 5px;
  border:1px solid var(--linie);border-radius:5px;background:var(--bg);
  font-family:inherit;font-size:11px;color:var(--text-3);pointer-events:none;
  transition:opacity .16s var(--e);
}
.cauta input:focus~kbd,.cauta input:not(:placeholder-shown)~kbd{opacity:0}

.invelis-oras{position:relative;margin-left:auto;flex:none}
.oras{
  flex:none;display:inline-flex;align-items:center;gap:6px;
  height:34px;padding:0 10px;border:1px solid var(--linie);border-radius:var(--r-ctl);
  background:var(--bg);font-size:13.5px;font-weight:500;cursor:pointer;
  transition:border-color .16s var(--e),background .16s var(--e);
}
.oras:hover{background:var(--panou)}
.oras svg{color:var(--text-3)}

/* panouri (căutare + oraș) */
.panou{
  position:absolute;z-index:50;background:var(--bg);
  border:1px solid var(--linie);border-radius:var(--r);box-shadow:var(--umbra);
  padding:5px;max-height:min(62vh,440px);overflow:auto;overscroll-behavior:contain;
}
.panou--cauta{top:calc(100% + 6px);left:0;right:0}
.panou--oras{top:calc(100% + 6px);right:0;width:232px}
.panou__grup{padding:9px 9px 5px;font-size:10.5px;font-weight:550;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3)}
.panou__grup:first-child{padding-top:5px}
.optiune{
  display:flex;width:100%;align-items:center;gap:9px;padding:7px 9px;
  border:0;background:none;border-radius:6px;text-align:left;cursor:pointer;font-size:13.5px;
}
.optiune:hover,.optiune[data-activ="da"]{background:var(--panou)}
.optiune em{margin-left:auto;font-style:normal;font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.optiune i{
  width:22px;height:22px;flex:none;display:grid;place-items:center;border-radius:5px;
  background:var(--panou);color:var(--text-2);font-style:normal;font-size:11px;font-weight:550;
}
.optiune[data-activ="da"] i{background:var(--text);color:var(--bg)}
.panou__nimic{padding:14px 10px;font-size:13px;color:var(--text-2)}

/* ---------- capul zilei ---------- */
.cap{padding:34px 0 4px;display:flex;align-items:flex-end;gap:16px 20px;flex-wrap:wrap}
.cap h1{font-size:1.8rem;line-height:1.08;letter-spacing:-.03em}
.cap p{margin:6px 0 0;font-size:13.5px;color:var(--text-2)}
.cap__dr{margin-left:auto;display:flex;align-items:center;gap:8px}
.filtru{
  display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 4px 0 11px;
  border:1px solid var(--linie);border-radius:var(--r-ctl);background:var(--panou);font-size:13px;font-weight:500;
}
.filtru button{
  width:20px;height:20px;display:grid;place-items:center;border:0;border-radius:5px;
  background:none;color:var(--text-2);cursor:pointer;
}
.filtru button:hover{background:var(--bg);color:var(--text)}

/* ---------- calendarul ---------- */
.calendar{
  display:flex;gap:2px;overflow-x:auto;overscroll-behavior-x:contain;
  margin:14px -24px 0;padding:2px 24px 20px;scrollbar-width:thin;
}
.calendar:empty{display:none}
.zi-cal{
  flex:0 0 auto;min-width:46px;padding:7px 7px 8px;border-radius:8px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  border:1px solid transparent;text-align:center;
  transition:background .16s var(--e),border-color .16s var(--e);
}
.zi-cal__d{font-size:10.5px;color:var(--text-3);line-height:1.1}
.zi-cal__n{font-size:15px;font-weight:550;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.zi-cal__c{font-size:11.5px;color:var(--text-3);line-height:1.1;font-variant-numeric:tabular-nums;min-height:13px}
.zi-cal--we{background:color-mix(in oklab,var(--panou) 60%,transparent)}
a.zi-cal:hover{background:var(--panou);border-color:var(--linie-2)}
.zi-cal--gol{opacity:.32}
.zi-cal[aria-current="date"] .zi-cal__n{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}
.zi-cal--ales,a.zi-cal--ales:hover{background:var(--text);border-color:var(--text)}
.zi-cal--ales .zi-cal__d,.zi-cal--ales .zi-cal__n,.zi-cal--ales .zi-cal__c{color:var(--bg)}

/* ---------- blocuri pliabile ---------- */
.bloc{border-top:1px solid var(--linie);margin-top:34px;padding-top:22px}
.bloc__cap{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin-bottom:2px}
.bloc__titlu{margin:0}
.bloc__titlu button{
  display:inline-flex;align-items:center;gap:8px;padding:2px 8px 2px 4px;margin-left:-4px;
  border:0;background:none;border-radius:7px;cursor:pointer;
  font-size:1.12rem;font-weight:600;letter-spacing:-.024em;
  transition:background .16s var(--e);
}
.bloc__titlu button:hover{background:var(--panou)}
.bloc__sageata{flex:none;color:var(--text-3);transition:transform .2s var(--e)}
.bloc__titlu button[aria-expanded="false"] .bloc__sageata{transform:rotate(-90deg)}
.bloc__meta{font-size:13px;color:var(--text-2)}
.bloc__corp{padding-top:2px}

/* ---------- benzi de oraș / zi ---------- */
.benzi{padding-bottom:64px}
.banda{
  display:grid;grid-template-columns:128px minmax(0,1fr);gap:0 28px;
  padding:24px 0;border-top:1px solid var(--linie-2);
}
.banda:first-child{border-top:0;padding-top:20px}
.banda__et{position:sticky;top:74px;align-self:start;padding-top:1px}
.banda__et b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.012em}
.banda__et span{display:block;margin-top:2px;font-size:12.5px;color:var(--text-3)}

.rafturi{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:24px 18px}

.show{display:flex;flex-direction:column;gap:9px}
.show__afis{
  position:relative;aspect-ratio:1000/1414;border-radius:var(--r);overflow:hidden;
  background:var(--panou);border:1px solid var(--linie-2);
  transition:border-color .2s var(--e);
}
.show__afis img{width:100%;height:100%;object-fit:cover}
@media (prefers-reduced-motion:no-preference){
  .show__afis img{transition:transform .55s var(--e)}
  .show:hover .show__afis img{transform:scale(1.022)}
}
.show:hover .show__afis{border-color:var(--linie)}
.show__gol{
  position:absolute;inset:0;display:grid;place-items:center;padding:14px;
  text-align:center;font-size:13px;font-weight:550;color:var(--text-3);line-height:1.3;
}
.show__meta{display:flex;align-items:baseline;gap:6px;font-size:12.5px;color:var(--text-2);min-width:0}
.show__ora{color:var(--text);font-weight:550;flex:none}
.show__sala{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.show__nume{
  font-size:14.5px;font-weight:550;line-height:1.32;letter-spacing:-.011em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.show__jos{display:flex;align-items:baseline;gap:8px;font-size:12.5px;color:var(--text-2)}
.show__rep{color:var(--text-3)}

.stare{
  position:absolute;left:8px;top:8px;height:22px;padding:0 8px;
  display:inline-flex;align-items:center;border-radius:6px;
  background:var(--bg);border:1px solid var(--linie);
  font-size:11.5px;font-weight:550;color:var(--text-2);
}
.stare--epuizat{color:var(--semnal);border-color:color-mix(in oklab,var(--semnal) 32%,var(--linie))}
.show--epuizat .show__afis img{filter:grayscale(.9);opacity:.66}
.show--epuizat .show__nume,.show--epuizat .show__meta{color:var(--text-2)}
.show--trecut{opacity:.52}
.show--trecut .show__afis img{filter:grayscale(.6)}

/* ---------- stare goală ---------- */
.gol{padding:44px 0 72px;max-width:52ch}
.gol h2{font-size:1.25rem;letter-spacing:-.022em}
.gol p{margin:9px 0 0;color:var(--text-2);font-size:14px}
.gol form{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px;max-width:400px}
.gol input{
  flex:1 1 200px;height:36px;padding:0 12px;font-size:13.5px;
  border:1px solid var(--linie);border-radius:var(--r-ctl);background:var(--panou);
}
.gol input:focus{outline:none;border-color:var(--text-3);background:var(--bg);box-shadow:0 0 0 3px var(--ring)}
.gol button{
  height:36px;padding:0 14px;border:1px solid var(--text);border-radius:var(--r-ctl);
  background:var(--text);color:var(--bg);font-size:13.5px;font-weight:550;cursor:pointer;
  transition:opacity .16s var(--e);
}
.gol button:hover{opacity:.86}
.gol small{display:block;margin-top:10px;font-size:12px;color:var(--text-3)}

.subsol{border-top:1px solid var(--linie-2);padding:20px 0 48px;font-size:12.5px;color:var(--text-3)}

@media (max-width:860px){
  .banda{grid-template-columns:1fr;gap:14px}
  .banda__et{position:static;display:flex;align-items:baseline;gap:8px}
  .banda__et span{margin-top:0}
}
@media (max-width:680px){
  .lat{padding:0 16px}
  .cap h1{font-size:1.5rem}
  .cap{padding-top:24px}
  .calendar{margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px}
  .bloc__titlu button{font-size:1.02rem}
  .rafturi{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:20px 14px}
  .marca{font-size:14px}
  .sus__in{gap:10px}
  .cauta kbd{display:none}
  .cauta{min-width:0}
  .oras{padding:0 8px;max-width:118px}
  .oras span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
</style>
</head>
<body>

<header class="sus">
  <div class="lat sus__in">
    <a class="marca" href="/">hailastandup</a>

    <div class="cauta">
      <svg class="cauta__lupa" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7.2" cy="7.2" r="4.6" stroke="currentColor" stroke-width="1.5"/>
        <path d="m10.8 10.8 2.7 2.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input id="q" type="text" autocomplete="off" spellcheck="false"
             placeholder="Caută un comediant, un club, un oraș"
             role="combobox" aria-expanded="false" aria-controls="rez" aria-autocomplete="list"
             aria-label="Caută un comediant, un club sau un oraș">
      <kbd>/</kbd>
      <div class="panou panou--cauta" id="rez" role="listbox" hidden></div>
    </div>

    <div class="invelis-oras">
      <button class="oras" id="btn-oras" type="button" aria-expanded="false" aria-haspopup="true">
        <span id="oras-nume">București</span>
        <svg width="10" height="10" viewBox="0 0 12 12" fill="none" aria-hidden="true">
          <path d="M2.6 4.6 6 8l3.4-3.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="panou panou--oras" id="panou-oras" role="menu" hidden></div>
    </div>
  </div>
</header>

<main class="lat">
  <div class="cap">
    <div>
      <h1 id="titlu-zi">&nbsp;</h1>
      <p id="meta-zi" class="nums"></p>
    </div>
    <div class="cap__dr" id="cap-dr"></div>
  </div>
  <div class="calendar" id="calendar" role="group" aria-label="Alege o zi"></div>
  <div class="benzi" id="benzi"></div>
  <div id="urmeaza"></div>
</main>

<footer class="lat subsol" id="subsol"></footer>

<script src="data/events.js"></script>
<script>
(function () {
  'use strict';

  var D = window.EVENTS_DATA;
  var $ = function (s) { return document.querySelector(s); };
  var params = new URLSearchParams(location.search);

  /* ---------- date ---------- */

  var ZILE = ['duminică', 'luni', 'marți', 'miercuri', 'joi', 'vineri', 'sâmbătă'];
  var LUNI = ['ianuarie', 'februarie', 'martie', 'aprilie', 'mai', 'iunie',
              'iulie', 'august', 'septembrie', 'octombrie', 'noiembrie', 'decembrie'];

  function pad(n) { return String(n).padStart(2, '0'); }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function dinIso(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }

  var AZI_REAL = iso(new Date());
  var ZI = /^\d{4}-\d{2}-\d{2}$/.test(params.get('zi') || '') ? params.get('zi') : AZI_REAL;

  function numeZi(s) {
    var d = dinIso(s);
    return ZILE[d.getDay()] + ', ' + d.getDate() + ' ' + LUNI[d.getMonth()];
  }
  function cuMajuscula(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function inZi(e, zi) {
    return e.multiDay ? (e.startDate <= zi && e.endDate >= zi) : e.startDate === zi;
  }

  /* Ora curentă contează doar când ziua afișată chiar e azi. */
  function minuteAcum() {
    if (ZI !== AZI_REAL) return -1;
    var n = new Date();
    return n.getHours() * 60 + n.getMinutes();
  }
  function inMinute(t) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(t || '');
    return m ? (+m[1]) * 60 + (+m[2]) : null;
  }

  function pretText(e) {
    if (e.pretDeLa == null) return null;
    var n = e.pretDeLa;
    var v = Number.isInteger(n) ? String(n) : n.toFixed(2).replace('.', ',').replace(/,00$/, '');
    return 'de la ' + v + ' lei';
  }

  /* Thumb-ul de pe iaBilet e semnat la 260x360. Originalul e liber si e A4 la rezolutie mare. */
  var PE_VERCEL = location.protocol === 'https:' && !/^(localhost|127\.|\[?::1)/.test(location.hostname);
  function original(url) {
    var m = String(url || '').match(/\/(https?%3A%2F%2F.+)$/i);
    return m ? decodeURIComponent(m[1]) : null;
  }
  function poza(e, w) {
    var o = original(e.image);
    if (!o) return e.image || '';
    return PE_VERCEL ? '/_vercel/image?url=' + encodeURIComponent(o) + '&w=' + w + '&q=80' : o;
  }

  function plat(s) {
    return String(s == null ? '' : s).normalize('NFD').replace(/[^a-z0-9 ]/gi, '').toLowerCase().trim();
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* ---------- stare ---------- */

  var orasSalvat = null;
  try { orasSalvat = localStorage.getItem('hls.oras'); } catch (err) { orasSalvat = null; }

  var stare = { oras: orasSalvat || 'București', filtru: null };

  /* ---------- index de căutare, doar peste ce nu a trecut ---------- */

  var SHOWURI = [];
  var VIITOARE = [];
  var INDEX = { nume: [], sala: [], oras: [] };
  var ORASE = [];

  function construieste() {
    /* Listarile-umbrela de turneu nu sunt reprezentatii: nu au ora, nu au sala, tin saptamani. */
    SHOWURI = D.events.filter(function (e) { return e.tip !== 'turneu'; });
    VIITOARE = SHOWURI.filter(function (e) { return (e.endDate || e.startDate) >= AZI_REAL; });

    INDEX = {
      nume: indexeaza(function (e) { return e.nume || []; }),
      sala: indexeaza(function (e) { return [e.venue]; }),
      oras: indexeaza(function (e) { return [e.oras]; })
    };

    ORASE = INDEX.oras
      .map(function (o) { return { nume: o.eticheta, n: o.ev.length }; })
      .sort(function (a, b) { return b.n - a.n || a.nume.localeCompare(b.nume, 'ro'); });

    /* Filtrul activ tine referinte la obiectele vechi; il leg din nou de indexul nou. */
    if (stare.filtru) {
      var proaspat = INDEX[stare.filtru.tip].find(function (o) { return o.cheie === stare.filtru.cheie; });
      stare.filtru = proaspat
        ? { tip: stare.filtru.tip, cheie: proaspat.cheie, eticheta: proaspat.eticheta, ev: proaspat.ev }
        : null;
    }
  }

  function indexeaza(cheieDin) {
    var m = new Map();
    VIITOARE.forEach(function (e) {
      cheieDin(e).forEach(function (brut) {
        if (!brut) return;
        var k = plat(brut);
        if (k.length < 2) return;
        if (!m.has(k)) m.set(k, { variante: new Map(), ev: [] });
        var g = m.get(k);
        g.variante.set(brut, (g.variante.get(brut) || 0) + 1);
        g.ev.push(e);
      });
    });
    /* Sursa scrie si "DAN BADEA", si "Dan Badea". Castiga forma cea mai frecventa. */
    return Array.from(m.entries()).map(function (par) {
      var variante = Array.from(par[1].variante.entries()).sort(function (a, b) { return b[1] - a[1]; });
      return { cheie: par[0], eticheta: variante[0][0], ev: par[1].ev };
    });
  }

  /* ---------- selectia si gruparea ---------- */

  function evenimenteDeAfisat() {
    if (!stare.filtru) return SHOWURI.filter(function (e) { return inZi(e, ZI); });
    return stare.filtru.ev.slice().sort(function (a, b) {
      return (a.startDate || '').localeCompare(b.startDate || '') ||
             (a.time || '').localeCompare(b.time || '');
    });
  }

  function plural(n, unu, multe) { return n + ' ' + (n === 1 ? unu : multe); }

  /* Un oras merita banda proprie doar daca umple un rand. Sub pragul asta ar iesi o eticheta
   * si trei coloane goale, deci orasele subtiri se string intr-o singura banda de coada. */
  var PRAG_BANDA = 3;

  function dupaOra(a, b) { return (a.time || '~').localeCompare(b.time || '~'); }

  function grupeaza(lista, mod, acum) {
    var pe = new Map();

    if (mod === 'zi') {
      lista.forEach(function (e) {
        if (!pe.has(e.startDate)) pe.set(e.startDate, []);
        pe.get(e.startDate).push(e);
      });
      return Array.from(pe.entries()).map(function (par) {
        return {
          eticheta: cuMajuscula(numeZi(par[0])),
          sub: par[0] === AZI_REAL ? 'azi' : plural(par[1].length, 'show', 'showuri'),
          ev: par[1].sort(dupaOra),
          aratOras: true
        };
      });
    }

    lista.forEach(function (e) {
      var o = e.oras || e.city || 'Fără oraș';
      if (!pe.has(o)) pe.set(o, []);
      pe.get(o).push(e);
    });
    pe.forEach(function (ev) {
      ev.sort(function (a, b) {
        var ta = inMinute(a.time), tb = inMinute(b.time);
        var pa = (ta != null && acum >= 0 && ta < acum) ? 1 : 0;
        var pb = (tb != null && acum >= 0 && tb < acum) ? 1 : 0;
        return pa - pb || (a.time || '~').localeCompare(b.time || '~');
      });
    });
    var ordonate = Array.from(pe.entries()).sort(function (a, b) {
      if (a[0] === stare.oras) return -1;
      if (b[0] === stare.oras) return 1;
      return b[1].length - a[1].length || a[0].localeCompare(b[0], 'ro');
    });

    var proprii = [], coada = [];
    ordonate.forEach(function (par) {
      if (par[0] === stare.oras || par[1].length >= PRAG_BANDA) proprii.push(par);
      else coada = coada.concat(par[1]);
    });

    var benzi = proprii.map(function (par) {
      return { eticheta: par[0], sub: plural(par[1].length, 'show', 'showuri'), ev: par[1], aratOras: false };
    });

    if (coada.length) {
      var orase = new Set(coada.map(function (e) { return e.oras || e.city; })).size;
      benzi.push({
        /* Cand nu e nimic altceva pe pagina, o eticheta „Alte orașe" n-ar avea fata de ce. */
        eticheta: benzi.length ? (orase === 1 ? (coada[0].oras || coada[0].city) : 'Alte orașe') : '',
        sub: benzi.length ? plural(orase === 1 ? coada.length : orase, orase === 1 ? 'show' : 'oraș', orase === 1 ? 'showuri' : 'orașe') : '',
        ev: coada.sort(dupaOra),
        aratOras: true
      });
    }

    return benzi;
  }

  /* ---------- randare ---------- */

  function cardShow(e, acum, aratOras) {
    var t = inMinute(e.time);
    var trecut = acum >= 0 && t != null && t < acum && !stare.filtru;
    var clase = 'show' + (e.soldOut ? ' show--epuizat' : '') + (trecut ? ' show--trecut' : '');
    var pret = pretText(e);
    var url = poza(e, 420);

    var stareEt = e.soldOut
      ? '<span class="stare stare--epuizat">Epuizat</span>'
      : (trecut ? '<span class="stare">A început</span>' : '');

    /* Originalul lipseste uneori de pe CDN. Atunci cade pe thumb-ul semnat, apoi pe titlu. */
    var afis = url
      ? '<img src="' + esc(url) + '" srcset="' + esc(url) + ' 1x, ' + esc(poza(e, 720)) + ' 2x"' +
        (e.image && e.image !== url ? ' data-rezerva="' + esc(e.image) + '"' : '') +
        ' alt="Afișul pentru ' + esc(e.titlu) + '" loading="lazy" decoding="async">'
      : '<span class="show__gol">' + esc(e.titlu) + '</span>';

    return '<a class="' + clase + '" href="' + esc(e.url || '#') + '" target="_blank" rel="noopener">' +
      '<div class="show__afis">' + afis + stareEt + '</div>' +
      '<div class="show__meta nums">' +
        (e.time ? '<span class="show__ora">' + esc(e.time) + '</span>' : '') +
        '<span class="show__sala">' + esc(numeLoc(e, aratOras)) + '</span>' +
      '</div>' +
      '<div class="show__nume">' + esc(e.titlu) + '</div>' +
      '<div class="show__jos nums">' +
        (pret ? '<span>' + esc(pret) + '</span>' : '') +
        (e.repriza ? '<span class="show__rep">repriza ' + e.repriza + '</span>' : '') +
      '</div>' +
    '</a>';
  }

  /* Cand banda e un oras, orasul e in eticheta. Cand banda e o zi, trebuie pus pe card. */
  function numeLoc(e, aratOras) {
    var oras = e.oras || e.city || '';
    var sala = e.venue || '';
    if (!aratOras) return sala || oras;
    if (!sala) return oras;
    return oras && oras !== sala ? sala + ', ' + oras : sala;
  }

  function benziHtml(grupuri, acum) {
    return grupuri.map(function (g) {
      return '<section class="banda">' +
        '<div class="banda__et">' +
          (g.eticheta ? '<b>' + esc(g.eticheta) + '</b><span class="nums">' + esc(g.sub) + '</span>' : '') +
        '</div>' +
        '<div class="rafturi">' +
          g.ev.map(function (e) { return cardShow(e, acum, g.aratOras); }).join('') +
        '</div>' +
      '</section>';
    }).join('');
  }

  /* ---------- ce urmează după ziua ancoră ---------- */

  var ZILE_SCURT = ['dum', 'lun', 'mar', 'mie', 'joi', 'vin', 'sâm'];
  var LUNI_SCURT = ['ian', 'feb', 'mar', 'apr', 'mai', 'iun', 'iul', 'aug', 'sep', 'oct', 'noi', 'dec'];

  function plusZile(zi, n) {
    var d = dinIso(zi);
    d.setDate(d.getDate() + n);
    return iso(d);
  }

  /* Fereastra vineri–duminică din care face parte ziua, sau următoarea dacă e deja duminică. */
  function fereastraWeekend(zi) {
    var g = dinIso(zi).getDay();
    var deplasare = g === 0 ? 5 : (g === 6 ? -1 : 5 - g);
    var vineri = plusZile(zi, deplasare);
    return [vineri, plusZile(vineri, 1), plusZile(vineri, 2)];
  }

  function evDinZile(zile) {
    return SHOWURI.filter(function (e) {
      return zile.some(function (z) { return inZi(e, z); });
    });
  }

  function numeScurt(zi) {
    var d = dinIso(zi);
    return ZILE_SCURT[d.getDay()] + ' ' + d.getDate();
  }

  /*
   * Mâine și poimâine apar doar când NU sunt deja în fereastra de weekend, altfel aceleași
   * showuri ar fi pe pagină de două ori. Vinerea, mâine și poimâine sunt sâmbătă și duminică,
   * deci rămâne doar blocul de weekend. Sub două zile rămase, weekendul nu merită bloc propriu.
   */
  function blocuriUrmatoare(ancora) {
    var relativ = ancora === AZI_REAL;
    var we = fereastraWeekend(ancora).filter(function (z) { return z > ancora; });
    var grupWe = we.length >= 2 ? we : [];
    var blocuri = [];

    for (var n = 1; n <= 2; n++) {
      var z = plusZile(ancora, n);
      if (grupWe.indexOf(z) !== -1) continue;
      var ev = evDinZile([z]);
      if (!ev.length) continue;
      blocuri.push({
        tip: n === 1 ? 'maine' : 'poimaine',
        eticheta: relativ ? (n === 1 ? 'Mâine' : 'Poimâine') : cuMajuscula(numeZi(z)),
        sufix: relativ ? numeZi(z).split(',')[0] : '',
        zile: [z], mod: 'oras', ev: ev
      });
    }

    if (grupWe.length) {
      var evWe = evDinZile(grupWe);
      if (evWe.length) {
        var g = dinIso(ancora).getDay();
        var et = !relativ ? 'Weekendul' : (g === 5 || g === 6) ? 'Restul weekendului'
               : g === 0 ? 'Weekendul viitor' : 'Weekendul ăsta';
        blocuri.push({
          tip: 'weekend',
          eticheta: et,
          sufix: numeScurt(grupWe[0]) + ' – ' + numeScurt(grupWe[grupWe.length - 1]),
          zile: grupWe, mod: 'zi', ev: evWe
        });
      }
    }

    return blocuri.sort(function (a, b) { return a.zile[0].localeCompare(b.zile[0]); });
  }

  function blocDeschis(tip) {
    try { return localStorage.getItem('hls.bloc.' + tip) !== 'inchis'; } catch (err) { return true; }
  }
  function salveazaBloc(tip, deschis) {
    try { localStorage.setItem('hls.bloc.' + tip, deschis ? 'deschis' : 'inchis'); } catch (err) { /* mod privat */ }
  }

  function urmatorulDupa(zi) {
    var viit = SHOWURI
      .filter(function (e) { return (e.startDate || '') > zi; })
      .sort(function (a, b) {
        return a.startDate.localeCompare(b.startDate) || (a.time || '').localeCompare(b.time || '');
      });
    return viit.length ? viit[0] : null;
  }

  function randeazaCap(lista) {
    var orase = new Set(lista.map(function (e) { return e.oras || e.city; })).size;

    if (stare.filtru) {
      $('#titlu-zi').textContent = stare.filtru.eticheta;
      $('#meta-zi').textContent = lista.length
        ? plural(lista.length, 'dată anunțată', 'date anunțate') + ', în ' + plural(orase, 'oraș', 'orașe')
        : 'nicio dată anunțată';
      $('#cap-dr').innerHTML =
        '<span class="filtru">' + esc(stare.filtru.eticheta) +
          '<button type="button" id="sterge-filtru" aria-label="Renunță la filtru">' +
            '<svg width="11" height="11" viewBox="0 0 12 12" fill="none" aria-hidden="true">' +
              '<path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>' +
            '</svg>' +
          '</button>' +
        '</span>';
      $('#sterge-filtru').addEventListener('click', function () {
        stare.filtru = null;
        $('#q').value = '';
        randeaza();
      });
      return;
    }

    $('#titlu-zi').textContent = ZI === AZI_REAL
      ? 'Azi, ' + numeZi(ZI).replace(', ', ' ')
      : cuMajuscula(numeZi(ZI));
    $('#meta-zi').textContent = lista.length
      ? plural(lista.length, 'show', 'showuri') + ', în ' + plural(orase, 'oraș', 'orașe')
      : '';
    $('#cap-dr').innerHTML = '';
  }

  function randeazaSubsol() {
    var d = new Date(D.scrapedAt);
    var cand = iso(d) === AZI_REAL
      ? 'azi, ora ' + pad(d.getHours()) + ':' + pad(d.getMinutes())
      : numeZi(iso(d)) + ', ora ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    $('#subsol').textContent =
      'Datele vin de pe iaBilet. Ultima verificare: ' + cand + '. ' +
      plural(SHOWURI.length, 'show în bază', 'showuri în bază') + '.';
  }

  /* ---------- calendarul ---------- */

  function numaraPeZi(nrZile) {
    var pe = new Map(), ord = [];
    for (var i = 0; i < nrZile; i++) {
      var z = plusZile(AZI_REAL, i);
      pe.set(z, 0);
      ord.push(z);
    }
    SHOWURI.forEach(function (e) {
      if (e.multiDay) {
        ord.forEach(function (z) { if (inZi(e, z)) pe.set(z, pe.get(z) + 1); });
      } else if (pe.has(e.startDate)) {
        pe.set(e.startDate, pe.get(e.startDate) + 1);
      }
    });
    return { pe: pe, ord: ord };
  }

  function randeazaCalendar() {
    var cal = $('#calendar');
    if (stare.filtru) { cal.innerHTML = ''; return; }

    var c = numaraPeZi(42);
    var lunaAnt = -1;

    cal.innerHTML = c.ord.map(function (z) {
      var d = dinIso(z);
      var n = c.pe.get(z);
      var g = d.getDay();
      var lunaNoua = d.getMonth() !== lunaAnt;
      lunaAnt = d.getMonth();

      var clase = 'zi-cal' +
        ((g === 5 || g === 6 || g === 0) ? ' zi-cal--we' : '') +
        (n ? '' : ' zi-cal--gol') +
        (z === ZI ? ' zi-cal--ales' : '');

      var corp =
        '<span class="zi-cal__d">' + ZILE_SCURT[g] + '</span>' +
        '<span class="zi-cal__n">' + d.getDate() + (lunaNoua ? ' ' + LUNI_SCURT[d.getMonth()] : '') + '</span>' +
        '<span class="zi-cal__c">' + (n || '') + '</span>';

      var comune = 'class="' + clase + '"' + (z === AZI_REAL ? ' aria-current="date"' : '');

      return n
        ? '<a ' + comune + ' href="?zi=' + z + '" aria-label="' + esc(numeZi(z)) + ', ' +
          esc(plural(n, 'show', 'showuri')) + '">' + corp + '</a>'
        : '<span ' + comune + ' aria-label="' + esc(numeZi(z)) + ', niciun show">' + corp + '</span>';
    }).join('');

    /* Ziua deschisă se aduce în centrul benzii, fără să miște pagina pe verticală. */
    var ales = cal.querySelector('.zi-cal--ales');
    if (ales) cal.scrollLeft = ales.offsetLeft - cal.clientWidth / 2 + ales.offsetWidth / 2;
  }

  /* ---------- blocurile care urmează ---------- */

  function randeazaUrmeaza() {
    var cont = $('#urmeaza');
    if (stare.filtru) { cont.innerHTML = ''; return; }

    cont.innerHTML = blocuriUrmatoare(ZI).map(function (b) {
      var orase = new Set(b.ev.map(function (e) { return e.oras || e.city; })).size;
      var deschis = blocDeschis(b.tip);

      return '<section class="bloc">' +
        '<div class="bloc__cap">' +
          '<h2 class="bloc__titlu">' +
            '<button type="button" data-bloc="' + esc(b.tip) + '" aria-expanded="' + deschis + '">' +
              '<svg class="bloc__sageata" width="11" height="11" viewBox="0 0 12 12" fill="none" aria-hidden="true">' +
                '<path d="M2.6 4.6 6 8l3.4-3.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>' +
              '</svg>' + esc(b.eticheta) +
            '</button>' +
          '</h2>' +
          '<span class="bloc__meta nums">' +
            (b.sufix ? esc(b.sufix) + ' · ' : '') +
            esc(plural(b.ev.length, 'show', 'showuri')) + ', în ' + esc(plural(orase, 'oraș', 'orașe')) +
          '</span>' +
        '</div>' +
        '<div class="bloc__corp"' + (deschis ? '' : ' hidden') + '>' +
          benziHtml(grupeaza(b.ev, b.mod, -1), -1) +
        '</div>' +
      '</section>';
    }).join('');

    Array.prototype.forEach.call(cont.querySelectorAll('[data-bloc]'), function (btn) {
      btn.addEventListener('click', function () {
        var deschis = btn.getAttribute('aria-expanded') !== 'true';
        btn.setAttribute('aria-expanded', String(deschis));
        btn.closest('.bloc').querySelector('.bloc__corp').hidden = !deschis;
        salveazaBloc(btn.getAttribute('data-bloc'), deschis);
      });
    });
  }

  function randeaza() {
    var lista = evenimenteDeAfisat();
    var acum = minuteAcum();
    var benzi = $('#benzi');

    randeazaCap(lista);

    if (!lista.length) {
      var urm = stare.filtru ? null : urmatorulDupa(ZI);
      benzi.innerHTML =
        '<div class="gol">' +
          '<h2>' + (stare.filtru ? 'Nicio dată anunțată.'
            : ZI === AZI_REAL ? 'Azi nu e nimic anunțat.' : 'În ziua asta nu e nimic anunțat.') + '</h2>' +
          '<p>' + (urm
            ? 'Următorul e ' + esc(numeZi(urm.startDate)) + (urm.time ? ', la ' + esc(urm.time) : '') +
              ': ' + esc(urm.titlu) + ', ' + esc(urm.oras || urm.city) + '.'
            : 'Când apare ceva, apare aici.') + '</p>' +
          '<form id="forma-gol">' +
            '<input type="email" placeholder="adresa ta de email" aria-label="Adresa ta de email" required>' +
            '<button type="submit">Anunță-mă</button>' +
          '</form>' +
          '<small>Un email pe săptămână, cu ce se joacă. Te dezabonezi dintr-un click.</small>' +
        '</div>';
      $('#forma-gol').addEventListener('submit', function (ev) { ev.preventDefault(); });
      randeazaCalendar();
      randeazaUrmeaza();
      randeazaSubsol();
      return;
    }

    benzi.innerHTML = benziHtml(grupeaza(lista, stare.filtru ? 'zi' : 'oras', acum), acum);

    randeazaCalendar();
    randeazaUrmeaza();
    randeazaSubsol();
  }

  /* ---------- oraș ---------- */

  var btnOras = $('#btn-oras');
  var panouOras = $('#panou-oras');

  function randeazaOrase() {
    panouOras.innerHTML =
      '<div class="panou__grup">Orașul tău</div>' +
      ORASE.slice(0, 14).map(function (o) {
        return '<button class="optiune" type="button" role="menuitem" data-oras="' + esc(o.nume) + '"' +
          ' data-activ="' + (o.nume === stare.oras ? 'da' : 'nu') + '">' +
          '<span>' + esc(o.nume) + '</span><em>' + o.n + '</em></button>';
      }).join('');

    Array.prototype.forEach.call(panouOras.querySelectorAll('[data-oras]'), function (b) {
      b.addEventListener('click', function () {
        stare.oras = b.getAttribute('data-oras');
        try { localStorage.setItem('hls.oras', stare.oras); } catch (err) { /* mod privat */ }
        $('#oras-nume').textContent = stare.oras;
        inchideOras();
        randeaza();
      });
    });
  }

  function deschideOras() {
    randeazaOrase();
    panouOras.hidden = false;
    btnOras.setAttribute('aria-expanded', 'true');
  }
  function inchideOras() {
    panouOras.hidden = true;
    btnOras.setAttribute('aria-expanded', 'false');
  }
  btnOras.addEventListener('click', function () {
    if (panouOras.hidden) { deschideOras(); } else { inchideOras(); }
  });

  /* ---------- căutare ---------- */

  var q = $('#q');
  var rez = $('#rez');
  var optiuni = [];
  var activ = -1;

  var GRUP = { nume: 'Comedianți', sala: 'Cluburi și săli', oras: 'Orașe' };
  var SEMN = { nume: '@', sala: '#', oras: '·' };

  function cauta(text) {
    var k = plat(text);
    if (k.length < 2) return [];
    function din(tip, lista, limita) {
      return lista
        .filter(function (o) { return o.cheie.indexOf(k) !== -1; })
        .sort(function (a, b) {
          var sa = a.cheie.indexOf(k) === 0 ? 0 : 1;
          var sb = b.cheie.indexOf(k) === 0 ? 0 : 1;
          return sa - sb || b.ev.length - a.ev.length;
        })
        .slice(0, limita)
        .map(function (o) { return { tip: tip, cheie: o.cheie, eticheta: o.eticheta, ev: o.ev }; });
    }
    return din('nume', INDEX.nume, 5).concat(din('sala', INDEX.sala, 3), din('oras', INDEX.oras, 3));
  }

  function randeazaRezultate() {
    if (!optiuni.length) {
      var scris = q.value.trim().length >= 2;
      rez.innerHTML = scris ? '<div class="panou__nimic">Nimic cu numele ăsta în datele de acum.</div>' : '';
      rez.hidden = !scris;
      q.setAttribute('aria-expanded', String(scris));
      return;
    }

    var html = '';
    var tipCurent = null;
    optiuni.forEach(function (o, i) {
      if (o.tip !== tipCurent) { html += '<div class="panou__grup">' + GRUP[o.tip] + '</div>'; tipCurent = o.tip; }
      html += '<button class="optiune" type="button" role="option" data-i="' + i + '"' +
        ' aria-selected="' + (i === activ) + '" data-activ="' + (i === activ ? 'da' : 'nu') + '">' +
        '<i>' + SEMN[o.tip] + '</i><span>' + esc(o.eticheta) + '</span><em>' + o.ev.length + '</em></button>';
    });

    rez.innerHTML = html;
    rez.hidden = false;
    q.setAttribute('aria-expanded', 'true');

    Array.prototype.forEach.call(rez.querySelectorAll('[data-i]'), function (b) {
      b.addEventListener('mousedown', function (ev) {
        ev.preventDefault();
        alege(optiuni[+b.getAttribute('data-i')]);
      });
    });
  }

  function alege(o) {
    stare.filtru = { tip: o.tip, cheie: o.cheie, eticheta: o.eticheta, ev: o.ev };
    q.value = o.eticheta;
    inchideCautare();
    randeaza();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function inchideCautare() {
    rez.hidden = true;
    activ = -1;
    q.setAttribute('aria-expanded', 'false');
  }

  q.addEventListener('input', function () {
    optiuni = cauta(q.value);
    activ = optiuni.length ? 0 : -1;
    randeazaRezultate();
  });
  q.addEventListener('focus', function () {
    if (q.value.trim().length >= 2) { optiuni = cauta(q.value); activ = optiuni.length ? 0 : -1; randeazaRezultate(); }
  });
  q.addEventListener('blur', function () { setTimeout(inchideCautare, 90); });
  q.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { inchideCautare(); q.blur(); return; }
    if (!optiuni.length || rez.hidden) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); activ = (activ + 1) % optiuni.length; randeazaRezultate(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); activ = (activ - 1 + optiuni.length) % optiuni.length; randeazaRezultate(); }
    else if (e.key === 'Enter' && activ >= 0) { e.preventDefault(); alege(optiuni[activ]); }
  });

  document.addEventListener('keydown', function (e) {
    var el = document.activeElement;
    if (e.key === '/' && el !== q && !/^(INPUT|TEXTAREA)$/.test(el ? el.tagName : '')) {
      e.preventDefault();
      q.focus();
      q.select();
    }
    if (e.key === 'Escape') inchideOras();
  });
  document.addEventListener('click', function (e) {
    if (!btnOras.contains(e.target) && !panouOras.contains(e.target)) inchideOras();
  });

  /* `error` nu urca, dar se prinde in faza de captare. */
  document.addEventListener('error', function (e) {
    var img = e.target;
    if (!img || img.tagName !== 'IMG' || !img.closest('.show__afis')) return;
    var rezerva = img.getAttribute('data-rezerva');
    if (rezerva) {
      img.removeAttribute('data-rezerva');
      img.removeAttribute('srcset');
      img.src = rezerva;
      return;
    }
    var cadru = img.closest('.show__afis');
    var titlu = img.getAttribute('alt').replace(/^Afișul pentru /, '');
    img.remove();
    cadru.insertAdjacentHTML('afterbegin', '<span class="show__gol">' + esc(titlu) + '</span>');
  }, true);

  /* ---------- reîmprospătare live ---------- */

  /*
   * /api/events citeste listingul acum, dar fara ora si fara tarife: alea cer o cerere
   * per spectacol si nu incap in timp. Deci listingul live spune CE se joaca si ce s-a
   * epuizat, iar snapshotul da ora si pretul. Se imbina dupa id, nu se inlocuieste.
   */
  function imbina(live) {
    var vechi = new Map(D.events.map(function (e) { return [e.id, e]; }));
    return live.events.map(function (e) {
      var v = vechi.get(e.id);
      if (!v) return e;
      return Object.assign({}, e, {
        time: e.time || v.time,
        tariffs: (e.tariffs && e.tariffs.length) ? e.tariffs : v.tariffs,
        pretDeLa: e.pretDeLa != null ? e.pretDeLa : v.pretDeLa
      });
    });
  }

  function reimprospateaza() {
    fetch('/api/events', { headers: { accept: 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); })
      .then(function (live) {
        if (!live || !Array.isArray(live.events) || !live.events.length) return;
        D = { source: live.source, scrapedAt: live.scrapedAt, count: live.count, events: imbina(live), live: true };
        construieste();
        randeaza();
      })
      .catch(function () { /* ramane snapshotul; e mai bine decat o pagina goala */ });
  }

  /* ---------- pornire ---------- */

  $('#oras-nume').textContent = stare.oras;

  /* Pe telefon nu incape intrebarea intreaga in caseta. */
  var ingust = window.matchMedia('(max-width:680px)');
  function placeholder() {
    q.placeholder = ingust.matches ? 'Caută' : 'Caută un comediant, un club, un oraș';
  }
  placeholder();
  ingust.addEventListener('change', placeholder);

  construieste();
  randeaza();
  reimprospateaza();
})();
</script>
</body>
</html>
